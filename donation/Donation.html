{{ block title }}
    Please decide
{{ endblock }}

{{ block content }}

    <p>You have <b>{{ C.ENDOWMENT }}</b>.</p>

    <!-- Output the recipient as usual (oTree default!) -->
    {{ formfield "recipient" }}

    <!-- This is a custom raw HTML widget: -->
    <label for="donation_amount">How much would you like to donate?</label><br>
    <input type="range" step="0.50" name="donation_amount" id="donation_amount">
    <p>Currently selected: €<span id="slider_value"></span></p>

    <script>
        let slider = document.getElementById("donation_amount");
        slider.min = js_vars.min;
        slider.max = js_vars.max;
        slider.value = js_vars.min;

        let display = document.getElementById("slider_value");
        display.innerText = slider.value;

        slider.addEventListener("input", function () {
            display.innerText = this.value;
        });
    </script>

    {{ next_button }}
{{ endblock }}
